# Reusable pipeline shared by every service (called from <service>.yml).
# Validate -> Test -> Analyze (lint, CodeQL gate) -> Scan (dependency gate, image) -> Build -> Verify -> Publish
name: service pipeline

on:
  workflow_call:
    inputs:
      service:
        description: Directory name under services/
        required: true
        type: string
      smoke-deps:
        description: Space-separated compose services the smoke test needs; built from source and started next to the service under test
        required: false
        type: string
        default: ""
      smoke-urls:
        description: Arguments for scripts/smoke-test.sh
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Validate + Test + Analyze (lint) + dependency scan (gate in security/dependency-scan/)
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/${{ inputs.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/${{ inputs.service }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Dependency scan gate (#3): fails on fixable high/critical advisories without a valid, unexpired exception.
      - name: Test the dependency gate
        working-directory: .
        run: node --test security/dependency-scan/gate.test.mjs
      # The exit code of npm audit is ignored on purpose: the gate decides and fails closed on an audit error.
      - name: Audit dependencies
        run: npm audit --json > "$RUNNER_TEMP/audit.json" || true
      - name: Fail on fixable high/critical advisories
        env:
          SERVICE: ${{ inputs.service }}
        run: node ../../security/dependency-scan/gate.mjs "$RUNNER_TEMP/audit.json"

  # SAST (ADR-002): findings go to the Security tab and any high/critical one fails the pipeline.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./security/sast/codeql-config.yml
      - uses: github/codeql-action/analyze@v3
        with:
          output: sarif-results
      - name: Test the gate
        run: node --test security/sast/gate.test.mjs
      # analyze uploads the results but never fails on them; this step is the gate.
      - name: Fail on high/critical findings
        run: node security/sast/gate.mjs sarif-results/*.sarif

  # Build once -> scan -> smoke test -> publish the SAME image (never rebuilt).
  image:
    needs: [verify, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SERVICE: ${{ inputs.service }}
      SMOKE_DEPS: ${{ inputs.smoke-deps }}
      SMOKE_URLS: ${{ inputs.smoke-urls }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${SERVICE}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (tag = commit SHA)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ inputs.service }}
          target: runtime
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      # Image scan gate (#4): fails on fixable high/critical vulnerabilities and on high/critical secrets in the image.
      # Accepted findings live in security/image-scan/.trivyignore (reason + expiry per entry).
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: security/image-scan/.trivyignore
          exit-code: "1"

      # Verify the built artifact in the same runtime local development uses (docker compose).
      # The service under test runs from the image built above; only its dependencies are built here.
      - name: Smoke test image
        run: |
          sh scripts/bootstrap.sh
          cd infrastructure/docker
          var="$(echo "$SERVICE" | tr 'a-z-' 'A-Z_')_IMAGE"
          export "$var=$IMAGE:${{ github.sha }}"
          # shellcheck disable=SC2086
          if [ -n "$SMOKE_DEPS" ]; then docker compose build $SMOKE_DEPS; fi
          # shellcheck disable=SC2086
          docker compose up -d --no-build --wait "$SERVICE" $SMOKE_DEPS
          cd ../..
          # shellcheck disable=SC2086
          sh scripts/smoke-test.sh $SMOKE_URLS

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f infrastructure/docker/docker-compose.yml logs --no-color || true

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE:${{ github.sha }}"
