# Release management (#35): release-please turns Conventional Commits since the last tag into a release
# PR (version bump + CHANGELOG.md); merging it is the deliberate step (REL-7) that creates the vX.Y.Z tag
# and the GitHub Release. The retag job then adds <service>:vX.Y.Z as a second tag on the SAME digest as
# <service>:<commit-sha> for all four services -- images are never rebuilt for a release (#6, immutable
# artifacts). The tag/PR merge don't wait on the four (separately triggered) service pipelines for that
# commit, so retag can still be catching up after the release is announced; it fails loudly (never tags
# a missing image) and is safe to re-run -- see docs/operations/runbooks/release.md.
#
# A draft-release-until-confirmed design was tried and reverted: release-please does not treat a draft
# release as "the last release" on its next run, so a stuck draft (e.g. a failed retag) desyncs its own
# tag bookkeeping and corrupts the next release PR. Immediate, non-draft tag/release creation is what
# release-please expects; a failed retag is communicated by the failed workflow run, not a hidden Release.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs only when the just-merged release PR produced a new tag (not on an ordinary push to main).
  retag:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      actions: read
    strategy:
      matrix:
        service: [api-gateway, user-service, order-service, notification-worker]
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Compute image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The commit-SHA image is published by this same push's service pipeline, which can still be
      # building when this job starts (GITHUB_TOKEN pushes/merges don't chain workflows, but the human
      # merge that lands the release commit does trigger it, in parallel with this one) -- wait for it.
      # 30 minutes of headroom (platform-tests alone runs ~15 minutes on shared runners), but each poll
      # also checks the service pipeline's own conclusion for this commit so a failure exits immediately
      # instead of waiting out the full timeout for an image that will never appear.
      - name: Wait for the commit-SHA image to publish
        run: |
          ref="$IMAGE:${{ github.sha }}"
          for i in $(seq 1 90); do
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              echo "found $ref"
              exit 0
            fi
            conclusion="$(gh run list -R "${{ github.repository }}" --workflow "${{ matrix.service }}.yml" --branch main \
              --json headSha,conclusion | jq -r --arg sha "$GITHUB_SHA" 'map(select(.headSha == $sha)) | .[0].conclusion // empty')"
            case "$conclusion" in
              failure|cancelled|timed_out)
                echo "::error::${{ matrix.service }}.yml concluded $conclusion for ${{ github.sha }}, $ref will never be published" >&2
                exit 1
                ;;
            esac
            echo "waiting for $ref ($i/90), ${{ matrix.service }}.yml: ${conclusion:-pending}"
            sleep 20
          done
          echo "::error::$ref never appeared" >&2
          exit 1

      # Registry-only retag, no pull and no rebuild: same digest, second tag. --prefer-index=false is
      # required -- with a single, single-platform source (which is what the build step produces),
      # imagetools create defaults to wrapping it in a new index, which changes the digest (verified:
      # v0.1.1 was first retagged without this flag and every service's digest came out different from
      # its <commit-sha> tag). imagetools create is idempotent, so re-running this step is safe.
      - name: Retag with the release version
        run: docker buildx imagetools create --prefer-index=false -t "$IMAGE:$TAG" "$IMAGE:${{ github.sha }}"

      - name: Record the retag
        run: echo "Tagged \`$IMAGE:$TAG\` alongside \`$IMAGE:${{ github.sha }}\` (same digest)" >> "$GITHUB_STEP_SUMMARY"
