# Cross-service tests against the whole compose stack: integration, contract and end to end
# (tests/{integration,contract,e2e}, Node's built-in test runner, no dependencies). The per-service pipelines
# prove one image at a time; this one proves the services work together with Keycloak, PostgreSQL, Redis and RabbitMQ.
#
# Three independent jobs instead of one long serial job (#28): each chaos scenario file already brings its own
# copy of the stack up in its `before` hook and needs nothing from the others, so they run as parallel jobs rather
# than parallel steps. `fast` carries the non-disruptive checks; `chaos-messaging-db` and `chaos-observability`
# carry the disruptive ones, split by whether they need the observability profile. Image builds are cached per
# service (.github/actions/build-compose-images) so `docker compose up` never rebuilds from scratch.
name: platform tests

on:
  push:
    branches: ['**']
    paths:
      - "services/**"
      - "infrastructure/docker/**"
      - "messaging/rabbitmq/**"
      - "security/keycloak/**"
      - "observability/**"
      - "tests/**"
      - ".github/workflows/platform-tests.yml"
      - ".github/actions/build-compose-images/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: ./.github/actions/build-compose-images

      - name: Start the stack
        run: |
          sh scripts/bootstrap.sh
          # with the observability profile: the pipeline tests need Prometheus, Tempo, Loki and Grafana
          docker compose -f infrastructure/docker/docker-compose.yml --profile observability up -d --wait

      - name: Observability configuration (rules, collector)
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/observability/prometheus:/p:ro" quay.io/prometheus/prometheus:v3.9.1 check rules /p/rules/platform.yml
          docker run --rm --entrypoint promtool -v "$PWD/observability/prometheus:/p:ro" quay.io/prometheus/prometheus:v3.9.1 test rules /p/tests/platform.test.yml
          docker run --rm -v "$PWD/observability/otel/collector/config.yaml:/c.yaml:ro" otel/opentelemetry-collector-contrib:0.161.0 validate --config=/c.yaml

      - name: Integration, contract and end-to-end tests
        run: node --test --test-concurrency=1 "tests/**/*.test.mjs"

      - name: Telemetry pipeline (traces, logs, metrics, dashboards, rules)
        run: node --test --test-concurrency=1 tests/observability/pipeline.obs.mjs

      - name: Telemetry pipeline counters on failure
        if: failure()
        run: |
          # spans/log records accepted, refused and sent by the collector, and what Tempo and Loki hold
          for q in otelcol_receiver_accepted_spans_total otelcol_receiver_refused_spans_total otelcol_processor_refused_spans_total                    otelcol_exporter_sent_spans_total otelcol_exporter_send_failed_spans_total                    otelcol_receiver_accepted_log_records_total otelcol_receiver_refused_log_records_total                    otelcol_exporter_sent_log_records_total otelcol_exporter_send_failed_log_records_total; do
            echo "== $q"; curl -s "http://localhost:9090/api/v1/query?query=$q" || true; echo
          done
          echo "== loki services"; curl -s http://localhost:3100/loki/api/v1/label/service_name/values || true; echo
          echo "== tempo search"; curl -s "http://localhost:3200/api/search?limit=20" || true; echo

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f infrastructure/docker/docker-compose.yml --profile observability logs --no-color || true

      - name: Stop the stack
        if: always()
        run: docker compose -f infrastructure/docker/docker-compose.yml --profile observability down -v

  chaos-messaging-db:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: ./.github/actions/build-compose-images

      - name: Start the stack
        run: |
          sh scripts/bootstrap.sh
          docker compose -f infrastructure/docker/docker-compose.yml up -d --wait

      - name: Keycloak outage behavior
        run: sh tests/chaos/keycloak-outage.sh

      - name: Broker, Redis, user-service and PostgreSQL failure behavior
        run: node --test --test-concurrency=1 tests/chaos/broker-failures.chaos.mjs tests/chaos/dependency-failures.chaos.mjs tests/chaos/database-failures.chaos.mjs

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f infrastructure/docker/docker-compose.yml logs --no-color || true

      - name: Stop the stack
        if: always()
        run: docker compose -f infrastructure/docker/docker-compose.yml down -v

  chaos-observability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: ./.github/actions/build-compose-images

      - name: Start the stack
        run: |
          sh scripts/bootstrap.sh
          docker compose -f infrastructure/docker/docker-compose.yml --profile observability up -d --wait

      - name: Observability failures and alerts
        run: node --test --test-concurrency=1 tests/chaos/observability-failures.chaos.mjs

      - name: Telemetry pipeline counters on failure
        if: failure()
        run: |
          for q in otelcol_receiver_accepted_spans_total otelcol_receiver_refused_spans_total otelcol_processor_refused_spans_total                    otelcol_exporter_sent_spans_total otelcol_exporter_send_failed_spans_total                    otelcol_receiver_accepted_log_records_total otelcol_receiver_refused_log_records_total                    otelcol_exporter_sent_log_records_total otelcol_exporter_send_failed_log_records_total; do
            echo "== $q"; curl -s "http://localhost:9090/api/v1/query?query=$q" || true; echo
          done
          echo "== loki services"; curl -s http://localhost:3100/loki/api/v1/label/service_name/values || true; echo
          echo "== tempo search"; curl -s "http://localhost:3200/api/search?limit=20" || true; echo

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f infrastructure/docker/docker-compose.yml --profile observability logs --no-color || true

      - name: Stop the stack
        if: always()
        run: docker compose -f infrastructure/docker/docker-compose.yml --profile observability down -v
