name: notification-worker

on:
  push:
    branches: [main]
    paths:
      - "services/notification-worker/**"
      - "infrastructure/docker/**"
      - "messaging/rabbitmq/**"
      - "security/keycloak/**"
      - "security/sast/**"
      - "scripts/**"
      - ".github/workflows/notification-worker.yml"
      - ".github/workflows/_service.yml"
  pull_request:
    paths:
      - "services/notification-worker/**"
      - "infrastructure/docker/**"
      - "messaging/rabbitmq/**"
      - "security/keycloak/**"
      - "security/sast/**"
      - "scripts/**"
      - ".github/workflows/notification-worker.yml"
      - ".github/workflows/_service.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notification-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/_service.yml
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read
    with:
      service: notification-worker
      # The worker is exercised end to end: an order created via order-service must arrive as a notification.
      smoke-deps: user-service order-service keycloak
      smoke-urls: http://localhost:3001 http://localhost:3002 http://localhost:3003
