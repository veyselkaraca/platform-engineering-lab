name: order-service

on:
  push:
    branches: [main]
    paths:
      - "services/order-service/**"
      - "infrastructure/docker/**"
      - "messaging/rabbitmq/**"
      - "scripts/**"
      - ".github/workflows/order-service.yml"
      - ".github/workflows/_service.yml"
  pull_request:
    paths:
      - "services/order-service/**"
      - "infrastructure/docker/**"
      - "messaging/rabbitmq/**"
      - "scripts/**"
      - ".github/workflows/order-service.yml"
      - ".github/workflows/_service.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: order-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/_service.yml
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      service: order-service
      # order-service needs user-service at runtime; build it from source for the smoke test.
      smoke-deps: user-service
      smoke-urls: http://localhost:3001 http://localhost:3002
