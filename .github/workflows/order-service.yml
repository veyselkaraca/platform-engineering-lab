name: order-service

on:
  push:
    branches: ['**']
    paths:
      - "services/order-service/**"
      - "infrastructure/docker/**"
      - "messaging/rabbitmq/**"
      - "security/keycloak/**"
      - "security/sast/**"
      - "security/dependency-scan/**"
      - "security/image-scan/**"
      - "security/secret-scan/**"
      - "scripts/**"
      - ".github/workflows/order-service.yml"
      - ".github/workflows/_service.yml"
      - ".github/workflows/secret-scan.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: order-service-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pipeline:
    uses: ./.github/workflows/_service.yml
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read
    with:
      service: order-service
      # The smoke test follows the order through user-service and on to the worker; build those from source.
      smoke-deps: user-service notification-worker keycloak
      smoke-urls: http://localhost:3001 http://localhost:3002 http://localhost:3003
