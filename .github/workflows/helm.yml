# Helm chart gate (#7): lint and template-render infrastructure/helm/platform-lab so a structural
# regression (bad values reference, invalid template) fails CI before anyone runs `helm upgrade` by hand.
# Semantic drift against each service's real env surface is not caught here (docs/architecture and the
# chart's own README call this out) — only `helm lint`/`helm template` structural checks.
#
# Also gates the raw Kubernetes manifests (#8: Namespace, Gateway API traffic entry point) the same
# way: schema/structure only, via kubeconform (no cluster — kubectl's own dry-run needs one just to
# resolve resource mappings, even for a built-in type). `--dry-run=server` against a real cluster
# (Gateway API CRDs + Envoy Gateway installed, per infrastructure/kubernetes/README.md) and the actual
# traffic-routing check from the issue's test plan stay manual — a kind/k3d job here would be
# disproportionate CI overhead for a lab (AGENTS.md §7.12).
name: helm

on:
  push:
    branches: ['**']
    paths:
      - "infrastructure/helm/**"
      - "infrastructure/kubernetes/**"
      - ".github/workflows/helm.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-template:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: helm lint
        run: helm lint infrastructure/helm/platform-lab

      - name: helm template (default values)
        run: |
          helm template platform-lab infrastructure/helm/platform-lab \
            --set apiGateway.image.tag=ci --set userService.image.tag=ci \
            --set orderService.image.tag=ci --set notificationWorker.image.tag=ci \
            > /tmp/platform-lab-default.yaml

      - name: helm template (values-prod.yaml override)
        run: |
          helm template platform-lab infrastructure/helm/platform-lab \
            -f infrastructure/helm/platform-lab/values-prod.yaml \
            --set apiGateway.image.tag=ci --set userService.image.tag=ci \
            --set orderService.image.tag=ci --set notificationWorker.image.tag=ci \
            > /tmp/platform-lab-prod.yaml

      # Every environment must render exactly one Deployment/Service/ConfigMap per service (7-1).
      - name: Verify rendered resource counts
        run: |
          for f in /tmp/platform-lab-default.yaml /tmp/platform-lab-prod.yaml; do
            for kind in Deployment Service ConfigMap; do
              count=$(grep -c "^kind: $kind$" "$f")
              if [ "$count" -ne 4 ]; then
                echo "expected 4 $kind resources in $f, got $count" >&2
                exit 1
              fi
            done
          done

  # #12: stateful dependencies (only Redis implemented so far, see infrastructure/helm/platform-data/README.md).
  lint-and-template-data:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: helm lint
        run: helm lint infrastructure/helm/platform-data

      - name: helm template
        run: helm template platform-data infrastructure/helm/platform-data > /tmp/platform-data.yaml

      # Redis (Deployment+Service), PostgreSQL (CloudNativePG Cluster + db-init Job+ConfigMap) and
      # RabbitMQ (RabbitmqCluster + rabbitmq-init Job+ConfigMap) — #12 in full.
      - name: Verify rendered resource counts
        run: |
          for kind in Deployment Service Cluster; do
            count=$(grep -c "^kind: $kind$" /tmp/platform-data.yaml)
            if [ "$count" -ne 1 ]; then
              echo "expected 1 $kind resource, got $count" >&2
              exit 1
            fi
          done
          for kind in Job ConfigMap; do
            count=$(grep -c "^kind: $kind$" /tmp/platform-data.yaml)
            if [ "$count" -ne 2 ]; then
              echo "expected 2 $kind resources, got $count" >&2
              exit 1
            fi
          done
          count=$(grep -c "^kind: RabbitmqCluster$" /tmp/platform-data.yaml)
          if [ "$count" -ne 1 ]; then
            echo "expected 1 RabbitmqCluster resource, got $count" >&2
            exit 1
          fi

  kubernetes-manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # `kubectl apply --dry-run=client` still needs a reachable API server to resolve the resource
      # mapping (even for a built-in type like Namespace, let alone Gateway API's CRD-backed kinds) —
      # there is no cluster in CI, and provisioning one here would be disproportionate for a lab
      # (AGENTS.md §7.12). kubeconform validates schema for everything under infrastructure/kubernetes/
      # with no cluster at all: its bundled schemas cover core types, and the CRD catalog covers Gateway
      # API. `--dry-run=server` against a real kind/k3d cluster with Envoy Gateway installed and the
      # actual traffic-routing check stay manual, per the issue's test plan.
      - name: Validate manifests (kubeconform, no cluster)
        run: |
          docker run --rm -v "$PWD/infrastructure/kubernetes:/manifests:ro" \
            ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /manifests
