# Helm chart gate (#7): lint and template-render infrastructure/helm/platform-lab so a structural
# regression (bad values reference, invalid template) fails CI before anyone runs `helm upgrade` by hand.
# Semantic drift against each service's real env surface is not caught here (docs/architecture and the
# chart's own README call this out) — only `helm lint`/`helm template` structural checks.
#
# Also gates the raw Kubernetes manifests (#8: Namespace, Gateway API traffic entry point) the same
# way: client-side schema/structure only. `--dry-run=server` against a real cluster (Gateway API CRDs +
# Envoy Gateway installed, per infrastructure/kubernetes/README.md) and the actual traffic-routing check
# from the issue's test plan stay manual — a kind/k3d job here would be disproportionate CI overhead for
# a lab (AGENTS.md §7.12).
name: helm

on:
  push:
    branches: ['**']
    paths:
      - "infrastructure/helm/**"
      - "infrastructure/kubernetes/**"
      - ".github/workflows/helm.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-template:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint infrastructure/helm/platform-lab

      - name: helm template (default values)
        run: |
          helm template platform-lab infrastructure/helm/platform-lab \
            --set apiGateway.image.tag=ci --set userService.image.tag=ci \
            --set orderService.image.tag=ci --set notificationWorker.image.tag=ci \
            > /tmp/platform-lab-default.yaml

      - name: helm template (values-prod.yaml override)
        run: |
          helm template platform-lab infrastructure/helm/platform-lab \
            -f infrastructure/helm/platform-lab/values-prod.yaml \
            --set apiGateway.image.tag=ci --set userService.image.tag=ci \
            --set orderService.image.tag=ci --set notificationWorker.image.tag=ci \
            > /tmp/platform-lab-prod.yaml

      # Every environment must render exactly one Deployment/Service/ConfigMap per service (7-1).
      - name: Verify rendered resource counts
        run: |
          for f in /tmp/platform-lab-default.yaml /tmp/platform-lab-prod.yaml; do
            for kind in Deployment Service ConfigMap; do
              count=$(grep -c "^kind: $kind$" "$f")
              if [ "$count" -ne 4 ]; then
                echo "expected 4 $kind resources in $f, got $count" >&2
                exit 1
              fi
            done
          done

  kubernetes-manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-kubectl@v4

      # A built-in type: kubectl's own discovery resolves it with no cluster needed.
      - name: kubectl apply --dry-run=client (namespace)
        run: kubectl apply --dry-run=client -f infrastructure/kubernetes/namespaces/

      # Gateway API kinds aren't built into kubectl — apply --dry-run=client still needs a cluster with
      # the CRDs registered just to resolve the resource mapping, which this repo intentionally doesn't
      # provision in CI (infrastructure/kubernetes/README.md). kubeconform validates the same manifests'
      # schema without one, pulling the Gateway API CRD schemas from a public catalog.
      - name: Validate Gateway API manifests (kubeconform, no cluster)
        run: |
          docker run --rm -v "$PWD/infrastructure/kubernetes/ingress:/manifests:ro" \
            ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /manifests
