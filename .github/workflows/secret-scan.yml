# Secret scan (#5): gitleaks over the whole git history on every push and pull request, and before any image is published.
# The commands live in security/secret-scan/scan.sh so CI and a laptop run exactly the same thing.
# No concurrency group on purpose: the service pipelines call this workflow too, and a shared group would cancel their runs.
name: secret scan

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      # Full history: a secret removed in a later commit is still leaked.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Fails the job if the config no longer detects a leak-shaped token or flags a placeholder.
      - name: Test the scan configuration
        run: sh security/secret-scan/scan.sh canary

      # Any finding fails the job; gitleaks also exits non-zero when it cannot run, so the gate fails closed.
      - name: Scan the git history
        run: sh security/secret-scan/scan.sh
