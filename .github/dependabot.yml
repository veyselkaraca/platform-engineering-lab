version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/services/api-gateway"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@nestjs/*"
        versions: [">=12"]
        # 12 is ESM-only; these services are CommonJS (see CLAUDE.md)
      - dependency-name: "jose"
        versions: [">=6"]
        # ^5 is the last CommonJS major; later majors are ESM-only
      - dependency-name: "typescript"
        versions: [">=7"]
        # ts-jest@29 peer-depends on typescript <7
      - dependency-name: "http-proxy-middleware"
        versions: [">=4"]
        # 4.x is ESM-only; this service is CommonJS

  - package-ecosystem: "npm"
    directory: "/services/order-service"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@nestjs/*"
        versions: [">=12"]
      - dependency-name: "jose"
        versions: [">=6"]
      - dependency-name: "typescript"
        versions: [">=7"]
      - dependency-name: "ioredis"
        versions: [">=6"]
        # typeorm@1.1.1 peer-depends on ioredis ^5.0.4

  - package-ecosystem: "npm"
    directory: "/services/notification-worker"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@nestjs/*"
        versions: [">=12"]
      - dependency-name: "jose"
        versions: [">=6"]
      - dependency-name: "typescript"
        versions: [">=7"]

  - package-ecosystem: "npm"
    directory: "/services/user-service"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@nestjs/*"
        versions: [">=12"]
      - dependency-name: "jose"
        versions: [">=6"]
      - dependency-name: "typescript"
        versions: [">=7"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/services/api-gateway"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
        # base image is pinned to Node 22 LTS; a major bump is a deliberate call, not a routine PR

  - package-ecosystem: "docker"
    directory: "/services/order-service"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/services/notification-worker"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/services/user-service"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
