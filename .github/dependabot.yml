version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/services/api-gateway"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@nestjs/*"
        versions: [">=12"]
        # 12 is ESM-only; these services are CommonJS (see CLAUDE.md)
      - dependency-name: "jose"
        versions: [">=6"]
        # ^5 is the last CommonJS major; later majors are ESM-only
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
        # ts-jest's peer range is ">=4.3 <7"; confirmed breaking npm ci (PR #50)
      - dependency-name: "http-proxy-middleware"
        update-types: ["version-update:semver-major"]
        # v4 breaks the proxy setup at runtime; confirmed by CI (PR #53)

  - package-ecosystem: "npm"
    directory: "/services/order-service"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@nestjs/*"
        versions: [">=12"]
      - dependency-name: "jose"
        versions: [">=6"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ioredis"
        update-types: ["version-update:semver-major"]
        # typeorm 0.3's peerOptional range is "^5.0.4"; confirmed breaking npm ci (PR #52)

  - package-ecosystem: "npm"
    directory: "/services/notification-worker"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@nestjs/*"
        versions: [">=12"]
      - dependency-name: "jose"
        versions: [">=6"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/services/user-service"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@nestjs/*"
        versions: [">=12"]
      - dependency-name: "jose"
        versions: [">=6"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/services/api-gateway"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
        # base image is pinned to Node 22 LTS; a major bump is a deliberate call, not a routine PR

  - package-ecosystem: "docker"
    directory: "/services/order-service"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/services/notification-worker"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/services/user-service"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
