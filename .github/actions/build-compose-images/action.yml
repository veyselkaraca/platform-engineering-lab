name: Build compose images
description: >
  Builds the four service images with the tags infrastructure/docker/docker-compose.yml expects by default
  (<service>:local), cached per service via the GitHub Actions cache so platform-tests.yml's `docker compose up`
  never rebuilds from scratch. Used by every platform-tests.yml job instead of `docker compose --build`.
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4
    - shell: bash
      run: |
        set -eu
        for service in user-service order-service notification-worker api-gateway; do
          docker buildx build \
            --target runtime \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --tag "${service}:local" \
            --cache-from "type=gha,scope=compose-${service}" \
            --cache-to "type=gha,mode=max,scope=compose-${service}" \
            --load \
            "services/${service}"
        done
