# OpenTelemetry Collector: the single ingestion point for logs, metrics and traces (docs/features/observability).
#   services --OTLP--> collector --traces--> Tempo
#                                --metrics-> Prometheus (scrapes :8889)
#                                --logs----> Loki (OTLP)
# It also probes the services and their hard dependencies (OB-7) and reports its own health (OBN-6).
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Continuous "is it up, is it ready" probes. Kubernetes readiness has the same meaning; this makes it a metric.
  http_check:
    collection_interval: 10s
    targets:
      - endpoint: http://api-gateway:3000/health/ready
      - endpoint: http://user-service:3000/health/ready
      - endpoint: http://order-service:3000/health/ready
      - endpoint: http://notification-worker:3000/health/ready
      - endpoint: http://api-gateway:3000/health/live
      - endpoint: http://user-service:3000/health/live
      - endpoint: http://order-service:3000/health/live
      - endpoint: http://notification-worker:3000/health/live
      - endpoint: http://keycloak:9000/health/ready

processors:
  # First in every pipeline: refuse data instead of running out of memory when a backend is slow.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

  batch:
    timeout: 2s

  # Metric labels: keep the service identity, drop per-process detail that only adds cardinality.
  resource/metrics:
    attributes:
      - { key: process.pid, action: delete }
      - { key: process.command, action: delete }
      - { key: process.command_args, action: delete }
      - { key: process.executable.name, action: delete }
      - { key: process.executable.path, action: delete }
      - { key: process.owner, action: delete }
      - { key: process.runtime.description, action: delete }
      - { key: process.runtime.name, action: delete }
      - { key: process.runtime.version, action: delete }
      - { key: host.name, action: delete }
      - { key: host.arch, action: delete }
      - { key: os.type, action: delete }
      - { key: os.version, action: delete }
      - { key: telemetry.sdk.language, action: delete }
      - { key: telemetry.sdk.name, action: delete }
      - { key: telemetry.sdk.version, action: delete }

  # A successful probe carries http.status_code, a failed one does not: two series per target. After a recovery the old
  # 0 series would live on for metric_expiration and make `min` (ServiceNotReady) report a ready service as not ready.
  transform/httpcheck:
    metric_statements:
      - context: datapoint
        statements:
          - delete_key(attributes, "http.status_code") where metric.name == "httpcheck.status"

  # OB-11 defence in depth: even if an instrumentation ever recorded these, they never leave the Collector.
  attributes/redact:
    actions:
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.cookie, action: delete }
      - { key: http.response.header.set-cookie, action: delete }
      - { key: db.query.parameter, action: delete }

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      queue_size: 1000
    retry_on_failure:
      max_elapsed_time: 30s

  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    sending_queue:
      queue_size: 1000
    retry_on_failure:
      max_elapsed_time: 30s

  prometheus:
    endpoint: 0.0.0.0:8889
    resource_constant_labels:
      included: [service.name, service.instance.id, service.namespace]
    metric_expiration: 1m # a probe or service that stopped reporting must not keep its last value (readiness alerts)

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp, http_check]
      processors: [memory_limiter, resource/metrics, transform/httpcheck, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlp_http/loki]
