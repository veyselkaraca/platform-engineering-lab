# Prometheus for the local stack (docs/features/observability). Application metrics arrive through the
# OpenTelemetry Collector (:8889); RabbitMQ and the observability components are scraped directly.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Metrics of the four services, http checks of the platform, all pushed to the Collector over OTLP.
  - job_name: otel-collector-app
    honor_labels: true
    static_configs:
      - targets: [otel-collector:8889]

  # The Collector itself (accepted/refused/dropped telemetry): the pipeline is observable too (OBN-6).
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]

  # Queue depth, DLQ depth and consumers per queue, straight from the broker (OB-5).
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs:
      - targets: [rabbitmq:15692]

  - job_name: rabbitmq-node
    metrics_path: /metrics
    static_configs:
      - targets: [rabbitmq:15692]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
