# Dev overlay: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Runs the services on the image's Node version with watch mode and debuggers
# (user-service 9229, order-service 9230, notification-worker 9231, api-gateway 9232).
# Attach with the "* attach (docker)" configs in .vscode/launch.json.
x-dev-service: &dev-service
  environment: &dev-env
    LOG_LEVEL: ${LOG_LEVEL:-debug}
    # Bind mounts on Windows/macOS don't emit fs events; poll instead.
    TSC_WATCHFILE: PriorityPollingInterval
    TSC_WATCHDIRECTORY: RecursiveDirectoryUsingDynamicPriorityPolling

services:
  user-service:
    build:
      target: dev
    image: user-service:dev
    environment:
      <<: *dev-env
    ports:
      - "127.0.0.1:9229:9229"
    volumes:
      - ../../services/user-service:/app
      - /app/node_modules
    command: ["npm", "run", "start:debug"]

  order-service:
    build:
      target: dev
    image: order-service:dev
    environment:
      <<: *dev-env
    ports:
      - "127.0.0.1:9230:9229"
    volumes:
      - ../../services/order-service:/app
      - /app/node_modules
    command: ["npm", "run", "start:debug"]

  notification-worker:
    build:
      target: dev
    image: notification-worker:dev
    environment:
      <<: *dev-env
    ports:
      - "127.0.0.1:9231:9229"
    volumes:
      - ../../services/notification-worker:/app
      - /app/node_modules
    command: ["npm", "run", "start:debug"]

  api-gateway:
    build:
      target: dev
    image: api-gateway:dev
    environment:
      <<: *dev-env
    ports:
      - "127.0.0.1:9232:9229"
    volumes:
      - ../../services/api-gateway:/app
      - /app/node_modules
    command: ["npm", "run", "start:debug"]
