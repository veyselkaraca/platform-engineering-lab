# Local runtime. Copy .env.example to .env first (scripts/bootstrap.sh does this).
name: platform-lab

x-postgres-auth: &postgres-auth
  POSTGRES_USER: ${POSTGRES_USER:?set in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}

services:
  postgres:
    image: postgres:17-alpine
    environment: *postgres-auth
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot and idempotent: creates one database per service (ADR-001) on every `up`,
  # so adding a service never requires wiping the data volume.
  db-init:
    image: postgres:17-alpine
    environment:
      <<: *postgres-auth
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: user_service,order_service,notification_worker
    volumes:
      - ./config/postgres/init-databases.sh:/init-databases.sh:ro
    entrypoint: ["sh", "/init-databases.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:8.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.2.5-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # Adds the shovel plugin used by scripts/replay-dlq.sh.
      - ../../messaging/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot and idempotent: imports messaging/rabbitmq/definitions after the broker is up.
  # (load_definitions at boot would skip creating the default user from the environment.)
  rabbitmq-init:
    image: rabbitmq:4.2.5-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - ../../messaging/rabbitmq/definitions/definitions.json:/definitions.json:ro
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        until rabbitmqadmin --host rabbitmq --username "$RABBITMQ_DEFAULT_USER" --password "$RABBITMQ_DEFAULT_PASS" list vhosts >/dev/null 2>&1; do sleep 2; done
        rabbitmqadmin --host rabbitmq --username "$RABBITMQ_DEFAULT_USER" --password "$RABBITMQ_DEFAULT_PASS" definitions import --file /definitions.json
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"

  user-service:
    build:
      context: ../../services/user-service
      target: runtime
      args:
        GIT_SHA: ${GIT_SHA:-local}
    image: ${USER_SERVICE_IMAGE:-user-service:${GIT_SHA:-local}}
    environment:
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/user_service
    ports:
      - "127.0.0.1:${USER_SERVICE_HOST_PORT:-3001}:3000"
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  order-service:
    build:
      context: ../../services/order-service
      target: runtime
      args:
        GIT_SHA: ${GIT_SHA:-local}
    image: ${ORDER_SERVICE_IMAGE:-order-service:${GIT_SHA:-local}}
    environment:
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/order_service
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      USER_SERVICE_URL: http://user-service:3000
    ports:
      - "127.0.0.1:${ORDER_SERVICE_HOST_PORT:-3002}:3000"
    # Redis, RabbitMQ and user-service are deliberately not hard dependencies:
    # the service degrades instead of refusing to start (see docs/features/order-notification).
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq-init:
        condition: service_completed_successfully
      user-service:
        condition: service_started
    restart: unless-stopped

  notification-worker:
    build:
      context: ../../services/notification-worker
      target: runtime
      args:
        GIT_SHA: ${GIT_SHA:-local}
    image: ${NOTIFICATION_WORKER_IMAGE:-notification-worker:${GIT_SHA:-local}}
    environment:
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/notification_worker
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      WORKER_PREFETCH: 10
      MAX_ATTEMPTS: 3
    ports:
      - "127.0.0.1:${NOTIFICATION_WORKER_HOST_PORT:-3003}:3000"
    # The topology (queues) must exist before the worker consumes; the worker also retries if it does not.
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # The single entry point. Backends also publish loopback ports for local debugging and smoke checks;
  # in a cluster only the gateway is exposed.
  api-gateway:
    build:
      context: ../../services/api-gateway
      target: runtime
      args:
        GIT_SHA: ${GIT_SHA:-local}
    image: ${API_GATEWAY_IMAGE:-api-gateway:${GIT_SHA:-local}}
    environment:
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      USER_SERVICE_URL: http://user-service:3000
      ORDER_SERVICE_URL: http://order-service:3000
      NOTIFICATION_WORKER_URL: http://notification-worker:3000
      UPSTREAM_TIMEOUT_MS: 10000
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
    ports:
      - "127.0.0.1:${API_GATEWAY_HOST_PORT:-8080}:3000"
    # Ordering only: the gateway does not fail when a backend is down (it answers 502 for that route).
    depends_on:
      user-service:
        condition: service_started
      order-service:
        condition: service_started
      notification-worker:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
