# Local runtime. Copy .env.example to .env first (scripts/bootstrap.sh does this).
name: platform-lab

x-postgres-auth: &postgres-auth
  POSTGRES_USER: ${POSTGRES_USER:?set in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}

x-auth-env: &auth-env
  # Token verification (docs/features/identity-keycloak). `iss` is what clients see (KC_HOSTNAME); keys are fetched
  # over the compose network. Public keys only: no secret is involved.
  AUTH_ISSUER: http://localhost:${KEYCLOAK_HOST_PORT:-8081}/realms/platform-lab
  AUTH_AUDIENCE: platform-api
  AUTH_JWKS_URL: http://keycloak:8080/realms/platform-lab/protocol/openid-connect/certs
  AUTH_JWKS_CACHE_SECONDS: ${AUTH_JWKS_CACHE_SECONDS:-3600}

x-otel-env: &otel-env
  # Telemetry (docs/features/observability): always on, exported to the collector. With the observability profile off
  # the collector does not exist and the bounded exports are simply dropped. OTEL_SERVICE_NAME is set per service.
  # OTEL_SDK_DISABLED lets a long-running profile-less run (e.g. CI chaos jobs) opt out of the collector hostname
  # never resolving at all instead of merely being down, which is otherwise a repeated DNS lookup every export
  # interval for the run's whole duration (services/*/src/telemetry.ts).
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_SEMCONV_STABILITY_OPT_IN: http
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=platform-lab,deployment.environment.name=local

services:
  postgres:
    image: postgres:17-alpine
    environment: *postgres-auth
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot and idempotent: creates one database per service (ADR-001) on every `up`,
  # so adding a service never requires wiping the data volume.
  db-init:
    image: postgres:17-alpine
    environment:
      <<: *postgres-auth
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: user_service,order_service,notification_worker,keycloak
    volumes:
      - ./config/postgres/init-databases.sh:/init-databases.sh:ro
    entrypoint: ["sh", "/init-databases.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:8.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.2.5-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # Adds the shovel plugin used by scripts/replay-dlq.sh.
      - ../../messaging/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot and idempotent: imports messaging/rabbitmq/definitions after the broker is up.
  # (load_definitions at boot would skip creating the default user from the environment.)
  rabbitmq-init:
    image: rabbitmq:4.2.5-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - ../../messaging/rabbitmq/definitions/definitions.json:/definitions.json:ro
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        until rabbitmqadmin --host rabbitmq --username "$RABBITMQ_DEFAULT_USER" --password "$RABBITMQ_DEFAULT_PASS" list vhosts >/dev/null 2>&1; do sleep 2; done
        rabbitmqadmin --host rabbitmq --username "$RABBITMQ_DEFAULT_USER" --password "$RABBITMQ_DEFAULT_PASS" definitions import --file /definitions.json
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"

  # Identity provider (docs/features/identity-keycloak). start-dev = local-only mode (HTTP, relaxed hostname).
  # --import-realm imports security/keycloak/realm/*.json only when the realm does not exist yet, so it is
  # idempotent but does not apply later edits to a used database (see security/keycloak/README.md).
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      # Pins the token `iss` so it is the same for clients on the host and in containers.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HOST_PORT:-8081}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../../security/keycloak/realm:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-8081}:8080"
    # The image has no curl: speak HTTP to the management port (9000) through bash /dev/tcp.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  user-service:
    build:
      context: ../../services/user-service
      target: runtime
      args:
        GIT_SHA: ${GIT_SHA:-local}
    image: ${USER_SERVICE_IMAGE:-user-service:${GIT_SHA:-local}}
    environment:
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/user_service
      <<: [*auth-env, *otel-env]
      OTEL_SERVICE_NAME: user-service
    ports:
      - "127.0.0.1:${USER_SERVICE_HOST_PORT:-3001}:3000"
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  order-service:
    build:
      context: ../../services/order-service
      target: runtime
      args:
        GIT_SHA: ${GIT_SHA:-local}
    image: ${ORDER_SERVICE_IMAGE:-order-service:${GIT_SHA:-local}}
    environment:
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/order_service
      <<: [*auth-env, *otel-env]
      OTEL_SERVICE_NAME: order-service
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      USER_SERVICE_URL: http://user-service:3000
    ports:
      - "127.0.0.1:${ORDER_SERVICE_HOST_PORT:-3002}:3000"
    # Redis, RabbitMQ and user-service are deliberately not hard dependencies:
    # the service degrades instead of refusing to start (see docs/features/order-notification).
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq-init:
        condition: service_completed_successfully
      user-service:
        condition: service_started
    restart: unless-stopped

  notification-worker:
    build:
      context: ../../services/notification-worker
      target: runtime
      args:
        GIT_SHA: ${GIT_SHA:-local}
    image: ${NOTIFICATION_WORKER_IMAGE:-notification-worker:${GIT_SHA:-local}}
    environment:
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/notification_worker
      <<: [*auth-env, *otel-env]
      OTEL_SERVICE_NAME: notification-worker
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      WORKER_PREFETCH: 10
      MAX_ATTEMPTS: 3
    ports:
      - "127.0.0.1:${NOTIFICATION_WORKER_HOST_PORT:-3003}:3000"
    # The topology (queues) must exist before the worker consumes; the worker also retries if it does not.
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # The single entry point. Backends also publish loopback ports for local debugging and smoke checks;
  # in a cluster only the gateway is exposed.
  api-gateway:
    build:
      context: ../../services/api-gateway
      target: runtime
      args:
        GIT_SHA: ${GIT_SHA:-local}
    image: ${API_GATEWAY_IMAGE:-api-gateway:${GIT_SHA:-local}}
    environment:
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      USER_SERVICE_URL: http://user-service:3000
      ORDER_SERVICE_URL: http://order-service:3000
      NOTIFICATION_WORKER_URL: http://notification-worker:3000
      UPSTREAM_TIMEOUT_MS: 10000
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      <<: [*auth-env, *otel-env]
      OTEL_SERVICE_NAME: api-gateway
    ports:
      - "127.0.0.1:${API_GATEWAY_HOST_PORT:-8080}:3000"
    # Ordering only: the gateway does not fail when a backend is down (it answers 502 for that route).
    depends_on:
      user-service:
        condition: service_started
      order-service:
        condition: service_started
      notification-worker:
        condition: service_started
    restart: unless-stopped

  # ---- Observability stack (docs/features/observability). Opt-in: docker compose --profile observability up -d
  # Services always send OTLP to the collector; without this profile the exports are simply dropped (OB-1).
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../../observability/otel/collector/config.yaml:/etc/otelcol/config.yaml:ro
    # No healthcheck: the image has no shell. Prometheus scrapes its self metrics (up{job="otel-collector"}).
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_started
    restart: unless-stopped

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../../observability/tracing/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    healthcheck:
      test: ["CMD", "/busybox/wget", "-qO-", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  loki:
    profiles: [observability]
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ../../observability/logging/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    # No healthcheck: the image has no shell. Grafana's datasource health and Prometheus (up{job="loki"}) cover it.
    restart: unless-stopped

  prometheus:
    profiles: [observability]
    image: quay.io/prometheus/prometheus:v3.9.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    volumes:
      - ../../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.3.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ../../observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning/dashboards:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:
