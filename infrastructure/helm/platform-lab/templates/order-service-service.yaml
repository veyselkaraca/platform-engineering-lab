apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    {{- include "platform-lab.labels" (dict "root" $ "name" "order-service") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "platform-lab.selectorLabels" (dict "name" "order-service") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.orderService.containerPort }}
      targetPort: http
