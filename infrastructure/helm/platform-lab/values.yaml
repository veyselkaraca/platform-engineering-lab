# Default (local/dev-like) values. Override per environment with values-<env>.yaml, e.g.:
#   helm upgrade --install platform-lab infrastructure/helm/platform-lab \
#     -f infrastructure/helm/platform-lab/values-prod.yaml \
#     --set apiGateway.image.tag=<commit-sha> --set userService.image.tag=<commit-sha> \
#     --set orderService.image.tag=<commit-sha> --set notificationWorker.image.tag=<commit-sha>
#
# image.tag defaults to "local" (never "latest") to mirror docker-compose's own ${GIT_SHA:-local}
# fallback; every real deploy overrides it to the immutable <service>:<commit-sha> built by CI.
#
# secretEnv entries reference a Secret that must already exist in the namespace (name/key only) —
# this chart never creates or generates one (AGENTS.md §24, engineering-standards.md #environments-and-secrets).

global:
  imagePullPolicy: IfNotPresent

apiGateway:
  containerPort: 3000
  replicaCount: 1
  image:
    repository: ghcr.io/veyselkaraca/platform-engineering-lab/api-gateway
    tag: local
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  terminationGracePeriodSeconds: 30
  readOnlyRootFilesystem: true
  env:
    LOG_LEVEL: info
    USER_SERVICE_URL: http://user-service:3000
    ORDER_SERVICE_URL: http://order-service:3000
    NOTIFICATION_WORKER_URL: http://notification-worker:3000
    UPSTREAM_TIMEOUT_MS: "10000"
    RATE_LIMIT_PER_MINUTE: "120"
    AUTH_ISSUER: http://localhost:8081/realms/platform-lab
    AUTH_AUDIENCE: platform-api
    AUTH_JWKS_URL: http://keycloak:8080/realms/platform-lab/protocol/openid-connect/certs
    AUTH_JWKS_CACHE_SECONDS: "3600"
    AUTH_JWKS_TIMEOUT_MS: "2000"
    OTEL_SDK_DISABLED: "false"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    OTEL_SEMCONV_STABILITY_OPT_IN: http
    OTEL_TRACES_SAMPLER: parentbased_always_on
    OTEL_RESOURCE_ATTRIBUTES: service.namespace=platform-lab,deployment.environment.name=dev
    OTEL_SERVICE_NAME: api-gateway
  secretEnv: {}

userService:
  containerPort: 3000
  replicaCount: 1
  image:
    repository: ghcr.io/veyselkaraca/platform-engineering-lab/user-service
    tag: local
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  terminationGracePeriodSeconds: 30
  readOnlyRootFilesystem: true
  env:
    LOG_LEVEL: info
    AUTH_ISSUER: http://localhost:8081/realms/platform-lab
    AUTH_AUDIENCE: platform-api
    AUTH_JWKS_URL: http://keycloak:8080/realms/platform-lab/protocol/openid-connect/certs
    AUTH_JWKS_CACHE_SECONDS: "3600"
    AUTH_JWKS_TIMEOUT_MS: "2000"
    OTEL_SDK_DISABLED: "false"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    OTEL_SEMCONV_STABILITY_OPT_IN: http
    OTEL_TRACES_SAMPLER: parentbased_always_on
    OTEL_RESOURCE_ATTRIBUTES: service.namespace=platform-lab,deployment.environment.name=dev
    OTEL_SERVICE_NAME: user-service
  secretEnv:
    DATABASE_URL:
      secretName: user-service-db
      secretKey: DATABASE_URL

orderService:
  containerPort: 3000
  replicaCount: 1
  image:
    repository: ghcr.io/veyselkaraca/platform-engineering-lab/order-service
    tag: local
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  terminationGracePeriodSeconds: 30
  readOnlyRootFilesystem: true
  env:
    LOG_LEVEL: info
    USER_SERVICE_URL: http://user-service:3000
    REDIS_URL: redis://redis:6379
    AUTH_ISSUER: http://localhost:8081/realms/platform-lab
    AUTH_AUDIENCE: platform-api
    AUTH_JWKS_URL: http://keycloak:8080/realms/platform-lab/protocol/openid-connect/certs
    AUTH_JWKS_CACHE_SECONDS: "3600"
    AUTH_JWKS_TIMEOUT_MS: "2000"
    OTEL_SDK_DISABLED: "false"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    OTEL_SEMCONV_STABILITY_OPT_IN: http
    OTEL_TRACES_SAMPLER: parentbased_always_on
    OTEL_RESOURCE_ATTRIBUTES: service.namespace=platform-lab,deployment.environment.name=dev
    OTEL_SERVICE_NAME: order-service
  secretEnv:
    DATABASE_URL:
      secretName: order-service-db
      secretKey: DATABASE_URL
    RABBITMQ_URL:
      secretName: platform-lab-rabbitmq
      secretKey: RABBITMQ_URL

notificationWorker:
  containerPort: 3000
  replicaCount: 1
  image:
    repository: ghcr.io/veyselkaraca/platform-engineering-lab/notification-worker
    tag: local
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  terminationGracePeriodSeconds: 30
  readOnlyRootFilesystem: true
  env:
    LOG_LEVEL: info
    WORKER_PREFETCH: "10"
    MAX_ATTEMPTS: "3"
    AUTH_ISSUER: http://localhost:8081/realms/platform-lab
    AUTH_AUDIENCE: platform-api
    AUTH_JWKS_URL: http://keycloak:8080/realms/platform-lab/protocol/openid-connect/certs
    AUTH_JWKS_CACHE_SECONDS: "3600"
    AUTH_JWKS_TIMEOUT_MS: "2000"
    OTEL_SDK_DISABLED: "false"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    OTEL_SEMCONV_STABILITY_OPT_IN: http
    OTEL_TRACES_SAMPLER: parentbased_always_on
    OTEL_RESOURCE_ATTRIBUTES: service.namespace=platform-lab,deployment.environment.name=dev
    OTEL_SERVICE_NAME: notification-worker
  secretEnv:
    DATABASE_URL:
      secretName: notification-worker-db
      secretKey: DATABASE_URL
    RABBITMQ_URL:
      secretName: platform-lab-rabbitmq
      secretKey: RABBITMQ_URL
