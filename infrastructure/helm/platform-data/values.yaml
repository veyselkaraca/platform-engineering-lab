# Default (local/dev-like) values for platform-data (#12) — PostgreSQL, Redis and RabbitMQ for the
# platform-lab namespace. Built incrementally, one dependency at a time; see README.md for the
# per-dependency decision record (#12-1) and what is and isn't implemented yet.
#
# Redis is deployed cache-only (AGENTS.md §21): a plain Deployment+Service, not the Bitnami chart
# (frozen since Aug 2025) and not an operator, with persistence explicitly disabled so a restart never
# leaves a stale save file behind (#12-5).
#
# PostgreSQL is the CloudNativePG operator's Cluster CRD (#12-1) — the operator itself is cluster
# infrastructure installed once per cluster (infrastructure/kubernetes/README.md), not vendored here.
# enableSuperuserAccess is on because db-init (below) and every service's manually-provisioned
# DATABASE_URL Secret (docs/operations/runbooks/kubernetes-secrets.md) share one admin identity across
# the four databases, exactly like docker-compose's single POSTGRES_USER today — this phase translates
# that layout to the cluster, it does not redesign per-service DB ownership.
#
# RabbitMQ is the RabbitMQ Cluster Operator's RabbitmqCluster CRD (#12-1), also cluster infrastructure
# installed once per cluster. Pinned to operator v2.19.2, not latest (v2.23.0): v2.20+ ships an
# admission webhook whose TLS certificate requires cert-manager, a second cluster-wide operator with no
# other use in this lab (AGENTS.md §7.12 — unjustified operational burden for one small CR). See
# README.md for the full decision.

global:
  imagePullPolicy: IfNotPresent

redis:
  containerPort: 6379
  replicaCount: 1
  image:
    repository: redis
    tag: 8.2-alpine
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }
  terminationGracePeriodSeconds: 30

postgres:
  clusterName: postgres
  instances: 1
  # CloudNativePG's own image (bundles the replication/backup tooling the operator drives); floating
  # minor like compose's own postgres:17-alpine, never "latest" (AGENTS.md §7.3).
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  enableSuperuserAccess: true
  storage:
    size: 1Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  # Same four databases db-init creates in docker-compose (ADR-001: one database per service);
  # reused as-is, not rewritten (issue #12's own design note).
  databases: user_service,order_service,notification_worker,keycloak
  # client image for the db-init Job (pg_isready/psql only, never runs the server) — matches the
  # server's own major version.
  clientImage: postgres:17-alpine

rabbitmq:
  clusterName: rabbitmq
  replicas: 1
  # Same image compose already uses for both the server and the rabbitmqadmin CLI in rabbitmq-init.
  image: rabbitmq:4.2.5-management-alpine
  storage: 1Gi
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 500m, memory: 1Gi }
