apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "platform-data.labels" (dict "root" $ "name" "redis") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "platform-data.selectorLabels" (dict "name" "redis") | nindent 4 }}
  ports:
    - name: redis
      port: {{ .Values.redis.containerPort }}
      targetPort: redis
