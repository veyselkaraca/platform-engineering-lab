# 9-3: each backend accepts ingress only from api-gateway, not from arbitrary pods in the namespace.
# One policy per backend (not a shared one) so each backend's allowed callers stay visible next to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-user-service
  namespace: platform-lab
  labels:
    app.kubernetes.io/part-of: platform-lab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: user-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-order-service
  namespace: platform-lab
  labels:
    app.kubernetes.io/part-of: platform-lab
