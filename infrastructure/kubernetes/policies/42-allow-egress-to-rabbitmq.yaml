# 9-4: order-service (publishes order.created) and notification-worker (consumes it) use RabbitMQ;
# user-service does not (RABBITMQ_URL in infrastructure/helm/platform-lab/values.yaml's secretEnv).
#
# ASSUMPTION (unverified until #12 lands): app.kubernetes.io/name: rabbitmq, port 5672 (AMQP). The
# management port (15672) is a local-compose-only debugging aid (scripts/replay-dlq.sh,
# tests/support/broker.mjs run against compose, not the cluster) and is deliberately not opened here.
# See the same note in 40-allow-egress-to-postgres.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-rabbitmq
  namespace: platform-lab
  labels:
    app.kubernetes.io/part-of: platform-lab
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [order-service, notification-worker]
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq
      ports:
        - protocol: TCP
          port: 5672
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rabbitmq-ingress-from-services
  namespace: platform-lab
  labels:
    app.kubernetes.io/part-of: platform-lab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [order-service, notification-worker]
      ports:
        - protocol: TCP
          port: 5672
