# Scanner settings shared by every service; analyze.sh runs the scanner from services/<name> and adds the project key.
# Paths are relative to that service directory.
sonar.sources=src
sonar.tests=test
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**
# Written by `npm test -- --coverage --coverageReporters=lcov`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
